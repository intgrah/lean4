name: RIIR / Rust workspace

on:
  push:
    branches:
      - riir
      - "riir/**"
  pull_request:
    branches:
      - riir
      - "riir/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      # No Lean build here: lean-runtime-sys/build.rs falls back to
      # src/include/lean/lean.h and synthesizes stub config.h/version.h/mimalloc.h
      # into OUT_DIR when CMake-generated copies aren't present. The
      # full LEAN_RUST_OVERRIDES=ON path is exercised by riir-lean-build.

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-riir-cargo-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'crates/**/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-riir-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
