name: RIIR / Lean build with overrides

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches:
      - riir
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/CMakeLists.txt"
      - "src/Lean/**"
      - "src/Init/**"
      - "src/Std/**"
      - ".github/workflows/riir-lean-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: stage1 + LEAN_RUST_OVERRIDES=ON
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libgmp-dev libuv1-dev ccache

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache C/C++ compile artifacts (ccache + stage0)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ccache
            build/release/stage0
          key: ${{ runner.os }}-riir-cpp-${{ hashFiles('stage0/**', 'src/**/*.cpp', 'src/**/*.h', 'src/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-riir-cpp-

      - name: Cache cargo registry (deps only; not the target dir)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-riir-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-riir-cargo-

      - name: Cache stage1 Lean artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/release/stage1/lib/lean
            build/release/stage1/lib/temp
          key: ${{ runner.os }}-riir-stage1-${{ hashFiles('src/Lean/**/*.lean', 'src/Init/**/*.lean', 'src/Std/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-riir-stage1-

      - name: Configure (LEAN_RUST_OVERRIDES=ON)
        run: cmake -B build/release -S . -DCMAKE_BUILD_TYPE=Release -DLEAN_RUST_OVERRIDES=ON

      - name: Build
        run: make -j$(nproc) -C build/release

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Smoke-check lean binary
        run: |
          build/release/stage1/bin/lean --version
          echo '#eval 1 + 1' > /tmp/smoke.lean
          build/release/stage1/bin/lean /tmp/smoke.lean

      - name: Run upstream test suite against override-on lean
        env:
          CTEST_PARALLEL_LEVEL: 4
          CTEST_OUTPUT_ON_FAILURE: 1
        run: make -C build/release -j$(nproc) test
